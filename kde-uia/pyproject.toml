[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kde-uia"
version = "0.1.2"
description = "Windows UI Automation-style desktop automation for Linux, KDE Plasma first (AT-SPI2, KWin, X11)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["accessibility", "at-spi", "uia", "automation", "kde", "plasma", "wayland", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: KDE",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment :: K Desktop Environment (KDE)",
  "Topic :: Software Development :: Testing",
]
# Zero pip dependencies: AT-SPI is reached through the distribution's PyGObject
# binding, so installation works offline and never builds against system libs.
dependencies = []

[project.optional-dependencies]
images = ["pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
kde-uia = "kde_uia.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kde_uia = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
